name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - name: Create fresh Flutter project structure
        run: |
          mkdir -p temp_backup
          cp pubspec.yaml temp_backup/
          cp -r lib temp_backup/
          
          cd ..
          flutter create alsaman_app --project-name=alsaman --platforms=android
          
          MANIFEST_PATH="alsaman_app/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:label="[^"]*"/android:label="ALSAMAN"/g' "$MANIFEST_PATH"
          fi

          cd alsaman_app
          rm -rf pubspec.yaml lib
          cp -r ../BASEM-LG/temp_backup/pubspec.yaml .
          cp -r ../BASEM-LG/temp_backup/lib .
          
          flutter pub get
          flutter build apk --release
          
          mkdir -p ../BASEM-LG/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../BASEM-LG/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSAMAN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
                <uses-permission android:name="android.permission.INTERNET" />\
                <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
                <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
                <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\
                <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\
                <uses-permission android:name="android.permission.BLUETOOTH" />\
                <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\
                <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
                <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />' "$MANIFEST_PATH"
          fi

          # تعديل اسم التطبيق الظاهر (label) في ملف AndroidManifest.xml ليكون ALSAMAN
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:label="[^"]*"/android:label="ALSAMAN"/g' "$MANIFEST_PATH"
          fi

          # نقل الملفات الحديثة للمشروع الجديد
          cd alsaman_app
          rm -rf pubspec.yaml lib
          cp -r ../BASEM-LG/temp_backup/pubspec.yaml .
          cp -r ../BASEM-LG/temp_backup/lib .
          
          # جلب الحزم والبناء
          flutter pub get
          flutter build apk --release
          
          # نقل ملف الـ APK الناتج
          mkdir -p ../BASEM-LG/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../BASEM-LG/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSAMAN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          cp -r ../BASEM-LG/temp_backup/lib .
          
          # الانتقال للمشروع وجلب الحزم والبناء
          flutter pub get
          flutter build apk --release
          
          # نقل ملف الـ APK الناتج إلى مسار الرفع
          mkdir -p ../BASEM-LG/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../BASEM-LG/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASEM-LG-APK
          path: build/app/outputs/flutter-apk/app-release.apk
