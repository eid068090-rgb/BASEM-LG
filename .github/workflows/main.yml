name: Build ALSAMAN APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Flutter Project & Copy Code
        run: |
          # حفظ مجلد الكود والـ pubspec مؤقتاً
          mkdir -p temp_backup
          cp -r lib temp_backup/ 2>/dev/null || true
          cp pubspec.yaml temp_backup/ 2>/dev/null || true
          
          # إنشاء مشروع فلاتر نظيف بالكامل وبأحدث المعايير
          flutter create . --org com.alsaman.app --project-name basem_lg --platforms=android
          
          # استعادة كود المشروع الخاص بك
          rm -rf lib/*
          cp -r temp_backup/lib/* lib/ 2>/dev/null || true
          cp temp_backup/pubspec.yaml ./ 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
