name: Flutter Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Make Gradle Wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Force Gradle 8.14
        run: |
          mkdir -p "$HOME/gradle-wrapper"
          ln -sf "$(which gradle)" "$HOME/gradle-wrapper/gradle"
          echo "$HOME/gradle-wrapper" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          which gradle
          gradle --version

      - name: Configure Gradle memory
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Show Gradle properties
        run: |
          echo "===== android/gradle.properties ====="
          cat android/gradle.properties
          echo "====================================="

      - name: Clean Flutter build
        run: flutter clean

      - name: Get packages again
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasemDeviceFinder-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
