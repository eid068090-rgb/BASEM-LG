name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - name: Create fresh Flutter project structure
        run: |
          # الاحتفاظ بملف pubspec.yaml و مجلد lib
          mkdir -p temp_backup
          cp pubspec.yaml temp_backup/
          cp -r lib temp_backup/
          
          # إنشاء مشروع جديد نظيف مؤقت بالاسم الحالي
          cd ..
          flutter create temp_project --platforms=android
          
          # نقل الملفات الحديثة للمشروع الجديد
          cd temp_project
          rm -rf pubspec.yaml lib
          cp -r ../BASEM-LG/temp_backup/pubspec.yaml .
          cp -r ../BASEM-LG/temp_backup/lib .
          
          # الانتقال للمشروع وجلب الحزم والبناء
          flutter pub get
          flutter build apk --release
          
          # نقل ملف الـ APK الناتج إلى مسار الرفع
          mkdir -p ../BASEM-LG/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../BASEM-LG/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASEM-LG-APK
          path: build/app/outputs/flutter-apk/app-release.apk
