name: Build BASEM-LG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
name steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name basem_lg .

      - name: Remove generated Flutter test
          run: rm -rf test

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
          """

          marker = "<application"

          if "android.permission.INTERNET" not in s:
              s = s.replace(marker, permissions + "\n    " + marker, 1)

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BASEM-LG-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
