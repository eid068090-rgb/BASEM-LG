name: Flutter Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Flutter 3.47.1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      # 4. معلومات Flutter
      - name: Flutter doctor
        run: flutter doctor -v

      # 5. تحميل Packages
      - name: Get packages
        run: flutter pub get

      # 6. فحص الكود
      - name: Analyze
        run: flutter analyze

      # 7. إعطاء Gradle Wrapper صلاحية التنفيذ
      - name: Make Gradle Wrapper executable
        working-directory: android
        run: chmod +x gradlew

      # 8. التأكد من إصدار Gradle
      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      # 9. بناء APK Debug
      - name: Build debug APK
        run: flutter build apk --debug

      # 10. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasemDeviceFinder-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
