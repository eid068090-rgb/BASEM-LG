name: Flutter Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 3.47.1
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      # Install Gradle 8.14
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # Check versions
      - name: Check toolchain
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Flutter ====="
          flutter --version

          echo "===== Gradle ====="
          gradle --version

      # Flutter doctor
      - name: Flutter doctor
        run: flutter doctor -v

      # Packages
      - name: Get packages
        run: flutter pub get

      # Analyze
      - name: Analyze
        run: flutter analyze

      # Make wrapper executable
      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      # IMPORTANT:
      # Force Gradle 8.14 instead of any Gradle 9.x on the runner.
      - name: Force Gradle 8.14
        run: |
          mkdir -p "$HOME/gradle-wrapper"
          ln -sf "$(which gradle)" "$HOME/gradle-wrapper/gradle"
          echo "$HOME/gradle-wrapper" >> "$GITHUB_PATH"

      # Verify again
      - name: Verify Gradle
        run: |
          which gradle
          gradle --version

      # Build APK
      - name: Build debug APK
        run: flutter build apk --debug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasemDeviceFinder-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
